<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scheduler</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Scheduler</h1>

    <div class="card">
      <input id="title" type="text" placeholder="Reminder title" />

      <p id="status"></p>
    </div>

    <ul id="list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
